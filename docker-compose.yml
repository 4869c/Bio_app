services:
  app:
    build: .
    container_name: bio_app
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Bio Farms"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bio_app
      DB_USERNAME: bio
      DB_PASSWORD: secret
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: bio_db
    environment:
      MYSQL_DATABASE: bio_app
      MYSQL_USER: bio
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
